[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-backend"
version = "1.0.0"
description = "Evidence-first authorized application security assessment platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.2,<7.0",
  "httpx>=0.28,<1.0",
  "dnspython>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "structlog>=25.1,<26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
